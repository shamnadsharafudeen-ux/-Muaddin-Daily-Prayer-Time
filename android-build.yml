name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Install dependencies
      run: npm install
    - name: Add Android platform
      run: cordova platform add android
    - name: Install plugins
      run: cordova plugin add cordova-plugin-local-notification cordova-plugin-geolocation cordova-plugin-media
    - name: Build Android
      run: cordova build android
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
    - name: Upload APK to Release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        asset_name: Muaddin-Prayer-Time-debug.apk
        asset_content_type: application/vnd.android.package-archive
