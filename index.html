
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Time</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@300;400;600;700&display=swap');

/* Body & Background */
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(ellipse at bottom,#0d1b2a 0%,#000814 100%);
  color:white;
  overflow-x:hidden;
  position:relative;
}

/* &#127775; Stars Background */
.stars{
  position:fixed;
  top:0; left:0; width:100%; height:100%; z-index:0; overflow:hidden;
}
.star{
  position:absolute;
  width:2px; height:2px;
  background:white; border-radius:50%;
  animation:twinkle 3s infinite ease-in-out;
}
@keyframes twinkle{
  0%,100%{opacity:0.2;}50%{opacity:1;}
}

/* &#127769; Realistic Moon Right */
.moon-right{
  position:fixed;
  top:80px; right:60px;
  width:150px; height:150px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fffef5 0%, #f8e8c8 35%, #d4af37 60%, #a67c00 100%);
  box-shadow:0 0 60px rgba(255,215,0,0.8),0 0 120px rgba(255,215,0,0.4),
             inset -25px -25px 40px rgba(0,0,0,0.45),
             inset 15px 15px 25px rgba(255,255,255,0.25);
  animation:floatMoon 6s ease-in-out infinite;
  z-index:1;
}
@keyframes floatMoon{0%{transform:translateY(0);}50%{transform:translateY(-25px);}100%{transform:translateY(0);}}


/* Top Banner */
.top-banner{
  text-align:center;
  padding:150px 10px 20px;
  position:relative;
  z-index:2;
}
.arabic-main{font-family:'Amiri',serif;font-size:42px;color:#FFD700;}
.english-main{font-size:32px;color:#FFD700;margin-top:5px;}
.english-sub{font-size:16px;color:#FFD700;margin-top:5px;}
.developer-line{margin-top:8px;font-size:14px;opacity:0.9;}
#todayDateDisplay{color:#FFD700;font-weight:600;margin-top:10px;}

/* Timer inside highlights */
#nextPrayerTimer{
  margin-top:10px;
  padding:14px;
  text-align:center;
  font-weight:600;
  color:#FFD700;

  border:2px solid rgba(255,215,0,0.6);
  border-radius:12px;
  background:rgba(255,215,0,0.08);

  box-shadow:0 0 15px rgba(255,215,0,0.4);
  animation:glowBorder 2s infinite alternate;
}

/* Added class for next prayer name */
.next-prayer-name {
  font-weight: bold; /* Explicitly bold */
  font-size: 1.2em; /* Moved from inline style */
  /* Centering is handled by the parent #nextPrayerTimer text-align: center; */
}

/* glow animation */
@keyframes glowBorder{
  0%{
    box-shadow:0 0 5px rgba(255,215,0,0.3);
  }
  100%{
    box-shadow:0 0 20px rgba(255,215,0,0.9);
  }
}

/* blinking icon */
.waiting-icon{
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%{opacity:0.3;}
  50%{opacity:1;}
  100%{opacity:0.3;}
}
/* Container */
.container{
  max-width:950px;
  margin:10px auto; /* Reduced margin-top from 30px to 10px */
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  position:relative;
  z-index:2;
}

/* Controls */
.controls{text-align:center;margin-bottom:15px;}
button,input,select{
  padding:10px 14px;
  margin:6px;
  border-radius:30px;
  border:none;
  font-weight:600;
}
button{background:linear-gradient(45deg,#FFD700,#FFA500);cursor:pointer;}
select{background:#FFD700;}
input{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);}

/* Table */
table{width:100%;margin-top:10px;border-collapse:collapse;background:rgba(0,0,0,0.85);}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.2);text-align:center;}
th{background:#1f2833;}
.highlight{background:rgba(212,175,55,0.18);border:1px solid rgba(212,175,55,0.5);color:#FFD700;font-weight:600;border-radius:6px;padding:6px;}
.current-day{background:rgba(212,175,55,0.25);border-left:3px solid #FFD700;}
.hijri-date{font-size:13px;opacity:0.8;}
.waiting-timer{
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:rgba(255,215,0,0.15);
  color:#FFD700;
  font-weight:600;
  text-align:center;
  font-size:15px;
  box-shadow:0 0 10px rgba(255,215,0,0.4);
}

tr:last-child td{
  border-bottom:none;
}
/* animated waiting icon */
@keyframes blink{
  0%{opacity:0.3;}
  50%{opacity:1;}
  100%{opacity:0.3;}
}

.waiting-icon{
  animation:blink 1.2s infinite;
}
</style>
</head>
<body>

<!-- Stars & Moon -->
<div class="stars" id="stars"></div>
<div class="moon-right"></div>

<!-- Top Banner -->
<div class="top-banner">
  <div class="arabic-main"> &#x645;&#x624;&#x630;&#x646; </div>
  <div class="english-main"> Muadhin </div>
  <div class="english-sub"> World Wide Prayer Time </div>
  <div class="developer-line">Developed by: Shamnad Sharafudeen (D-Bross)</div>
  <p id="todayDateDisplay"></p>
  <div id="nextPrayerTimer"></div>
  <div id="todayPrayers"></div>
</div>

<!-- Calendar & Controls -->
<div class="container" id="content">
  <div class="controls">
    <select onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="ar">&#x627;&#x644;&#x639;&#x631;&#x62B;&#x64A;&#x629;</option>
      <option value="hi">&#x939;&#x93F;&#x92B;&#x926;&#x940;</option>
      <option value="ur">&#x627;&#x631;&#x62F;&#x648;</option>
    </select>

    <button onclick="getLocation()">&#128205; Auto Detect</button>
    <input type="text" id="city" placeholder="Enter City">
    <button onclick="manualSearch()">Search</button>
    <button onclick="displayView('week')">Week</button>
    <button onclick="displayView('month')">Month</button>
    <button onclick="toggleAdhaan()" id="adhaanBtn">&#128266; Auto Adhaan ON</button>
  </div>

  <div id="calendar"></div>
</div>

<!-- Adhaan Audio -->
<audio id="adhaanAudio" preload="auto">
  <source src="https://cdn.islamic.network/audio/adhan/adhan.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== Stars Background ===== */
const starContainer=document.getElementById("stars");
for(let i=0;i<250;i++){
  let star=document.createElement("div");
  star.classList.add("star");
  star.style.top=Math.random()*100+"%";
  star.style.left=Math.random()*100+"%";
  star.style.animationDuration=(2+Math.random()*4)+"s";
  star.style.opacity=Math.random();
  starContainer.appendChild(star);
}

/* ===== LANGUAGE ===== */
let currentLanguage="en";
let lastData=null;
const translations={
  en:{day:"Day",date:"Date",fajr:"Fajr",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha",next:"Next Prayer"},
  ar:{day:"\u0627\u0644\u064A\u0648\u0645",date:"\u0627\u0644\u062A\u0627\u0631\u064A\u062E",fajr:"\u0627\u0644\u0641\u062C\u0631",dhuhr:"\u0627\u0644\u0638\u0647\u0631",asr:"\u0627\u0644\u0639\u0635\u0631",maghrib:"\u0627\u0644\u0645\u063B\u0631\u0628",isha:"\u0627\u0644\u0639\u0634\u0627\u0621",next:"\u0627\u0644\u0635\u0644\u0627\u0629 \u0627\u0644\u0642\u0627\u062F\u0645\u0629"},
  hi:{day:"\u0926\u093F\u0928",date:"\u0924\u093E\u0930\u0940\u0916",fajr:"\u092B\u091C\u094D\u0930",dhuhr:"\u091C\u093C\u0941\u0939\u0930",asr:"\u0905\u0938\u0930",maghrib:"\u092E\u0917\u0930\u093F\u092B",isha:"\u0908\u0936\u093E",next:"\u0905\u0917\u0932\u0940 \u0928\u092B\u093E\u091C\u093C"},
  ur:{day:"\u062B\u0627\u0644\u0627\u0646\u06A9\u06C1",date:"\u062A\u0627\u0631\u06CC\u062E",fajr:"\u0641\u062C\u0631",dhuhr:"\u0638\u06C1\u0631",asr:"\u0639\u0635\u0631",maghrib:"\u0645\u063A\u0631\u0628",isha:"\u0639\u0634\u0627\u0621",next:"\u0627\u06AF\u0644\u06CC \u0646\u0645\u0627\u0632"}
};
function changeLanguage(lang){
  currentLanguage=lang;
  document.body.style.direction=(lang==="ar"||lang==="ur")?"rtl":"ltr";
  if(lastData) renderCalendar(lastData, 'today'); // Default to today's view on language change
}

/* ===== TIME FORMAT ===== */
function convertToAMPM(time){
  time=time.replace(/ \(.*\)/,'');
  let [h,m]=time.split(":");
  h=parseInt(h);
  let ampm=h>=12?"PM":"AM";
  h=h%12;
  h=h? h:12;
  return h+":"+m+" "+ampm;
}

/* ===== PRAYER SYSTEM ===== */
let prayerTimesToday=null;
let adhaanEnabled=true;
let lastAdhaanMinute=null;

function toggleAdhaan(){
  adhaanEnabled=!adhaanEnabled;
  document.getElementById("adhaanBtn").innerText=
    adhaanEnabled?"&#128266; Auto Adhaan ON":"&#128263; Auto Adhaan OFF";
  if (adhaanEnabled) {
    document.getElementById("adhaanAudio").play();
    lastAdhaanMinute = null; // Reset this to allow immediate auto-adhan if conditions met
  } else {
    document.getElementById("adhaanAudio").pause();
    document.getElementById("adhaanAudio").currentTime = 0; // Rewind the audio
  }
}

function initializePrayerSystem(timings){
  prayerTimesToday={
    Fajr:timings.Fajr.substring(0,5),
    Dhuhr:timings.Dhuhr.substring(0,5),
    Asr:timings.Asr.substring(0,5),
    Maghrib:timings.Maghrib.substring(0,5),
    Isha:timings.Isha.substring(0,5)
  };
  setInterval(updatePrayerSystem,1000);
}

function updatePrayerSystem(){
  if(!prayerTimesToday) return;
  let now=new Date();
  let ch=now.getHours().toString().padStart(2,'0');
  let cm=now.getMinutes().toString().padStart(2,'0');
  let current=ch+":"+cm;

  let next=null,nextName=null;
  for(let p in prayerTimesToday){
    if(current<prayerTimesToday[p]){
      next=prayerTimesToday[p]; nextName=p; break;
    }
  }
  if(!next){ next=prayerTimesToday.Fajr; nextName="Fajr (Tomorrow)"; }

  let [h,m]=next.split(":");
  let nextDate=new Date();
  nextDate.setHours(parseInt(h)); nextDate.setMinutes(parseInt(m)); nextDate.setSeconds(0);
  if(current>next) nextDate.setDate(nextDate.getDate()+1);

  let diff=nextDate-now;
  let hh=Math.floor(diff/1000/60/60);
  let mm=Math.floor((diff/1000/60)%60);
  let ss=Math.floor((diff/1000)%60);

  for(let p in prayerTimesToday){
    if(current===prayerTimesToday[p] && lastAdhaanMinute!==current && adhaanEnabled){
      document.getElementById("adhaanAudio").play();
      lastAdhaanMinute=current;
    }
  }
}

/* ===== LOCATION ===== */
function getLocation(){
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude; const lon=pos.coords.longitude;
    const response=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
    const data=await response.json();
    let city=data.address.city || data.address.town || data.address.village || data.address.state;
    let country=data.address.country;
    loadRamadan(city,country);
  },()=>{alert("Location permission denied.");});
}
function manualSearch(){
  let city=document.getElementById("city").value.trim();
  if(city===""){alert("Please enter city name."); return;}
  loadRamadan(city,"");
}

/* ===== LOAD & RENDER ===== */
async function loadRamadan(city,country){
  let today = new Date();
  let month = today.getMonth() + 1;   // Current month (1-12)
  let year = today.getFullYear();     // Current year

  const response = await fetch(
    `https://api.aladhan.com/v1/calendarByCity/${year}/${month}?city=${city}&country=${country}&method=4`
  );

  const data = await response.json();
  lastData = data;
  renderCalendar(data, 'today'); // Default to today's view
}

function displayView(viewMode) {
  if (lastData) {
    renderCalendar(lastData, viewMode);
  }
}

function startNextPrayerTimer(prayerTimes){

  function updateTimer(){
    let now = new Date();
    let currentMinutes = now.getHours()*60 + now.getMinutes();

    let nextName = "";
    let nextTime = 0;

    for(let p in prayerTimes){
      let [h,m] = prayerTimes[p].split(":");
      let total = parseInt(h)*60 + parseInt(m);

      if(total > currentMinutes){
        nextName = p;
        nextTime = total;
        break;
      }
    }

    // If all prayers passed &#x2192; next is tomorrow Fajr
    if(!nextName){
      nextName = "Fajr";
      let [h,m] = prayerTimes.Fajr.split(":");
      nextTime = (parseInt(h)*60 + parseInt(m)) + 1440;
    }

    let diff = nextTime - currentMinutes;

    let hh = Math.floor(diff/60);
    let mm = diff % 60;
    let ss = 59 - now.getSeconds();

    let dots = ".".repeat((now.getSeconds()%3)+1);

    document.getElementById("nextPrayerTimer").innerHTML = `
      <span class="waiting-icon">&#9203;</span> Next Prayer: <b class="next-prayer-name">${nextName}</b><br>
      &#9200; ${hh}h ${mm}m ${ss}s remaining
    `;
  }

  updateTimer();
  setInterval(updateTimer,1000);
}

function renderCalendar(data, viewMode = 'today'){
  let todayDate=new Date();
  let currentDay=todayDate.getDate();
  let today=data.data[currentDay-1];

  document.getElementById("todayDateDisplay").innerHTML=
    today.date.gregorian.date+" | "+today.date.hijri.date;

  let todayPrayersHTML = `
    <p>${translations[currentLanguage].fajr}: ${convertToAMPM(today.timings.Fajr)}</p>
    <p>${translations[currentLanguage].dhuhr}: ${convertToAMPM(today.timings.Dhuhr)}</p>
    <p>${translations[currentLanguage].asr}: ${convertToAMPM(today.timings.Asr)}</p>
    <p>${translations[currentLanguage].maghrib}: ${convertToAMPM(today.timings.Maghrib)}</p>
    <p>${translations[currentLanguage].isha}: ${convertToAMPM(today.timings.Isha)}</p>
  `;

  document.getElementById("todayPrayers").innerHTML=todayPrayersHTML;

  initializePrayerSystem(today.timings);
  startNextPrayerTimer(prayerTimesToday);

  let tableData = [];
  if (viewMode === 'today') {
    tableData = [today];
  } else if (viewMode === 'week') {
    // Get current day's index (0-indexed from the monthly data)
    const startIndex = currentDay - 1;
    // Get 7 days starting from today or until end of month
    tableData = data.data.slice(startIndex, startIndex + 7);
  } else if (viewMode === 'month') {
    tableData = data.data;
  }

  let table=`<table><tr>
    <th>${translations[currentLanguage].day}</th>
    <th>${translations[currentLanguage].date}</th>
    <th>${translations[currentLanguage].fajr}</th>
    <th>${translations[currentLanguage].dhuhr}</th>
    <th>${translations[currentLanguage].asr}</th>
    <th>${translations[currentLanguage].maghrib}</th>
    <th>${translations[currentLanguage].isha}</th>
  </tr>`;

  tableData.forEach((day,index)=>{
    // Check if the day object is valid before accessing its properties
    if (day && day.date && day.date.gregorian && day.timings) {
      let isCurrentDay = (parseInt(day.date.gregorian.day) === currentDay && viewMode !== 'week'); // Highlight current day only in 'today' and 'month' view, not week
      table+=`<tr class="${isCurrentDay?'current-day':''}">
        <td>${day.date.gregorian.day}</td>
        <td>${day.date.gregorian.date}<div class="hijri-date">${day.date.hijri.date}</div></td>
        <td class="highlight">${convertToAMPM(day.timings.Fajr)}</td>
        <td>${convertToAMPM(day.timings.Dhuhr)}</td>
        <td>${convertToAMPM(day.timings.Asr)}</td>
        <td>${convertToAMPM(day.timings.Maghrib)}</td>
        <td>${convertToAMPM(day.timings.Isha)}</td>
      </tr>`;
    }
  });
  table+="</table>";

  // Add navigation buttons based on viewMode
  table += `<div style="text-align:center; margin-top: 20px;">`;
  if (viewMode === 'today') {
    table += `<button onclick="displayView('week')">Week Prayer Time</button>`;
  } else if (viewMode === 'week') {
    table += `<button onclick="displayView('month')">Month Prayer Time</button>`;
  }
  // Always include the PDF download button
  table += `<button onclick="downloadPDF()">&#128196; PDF</button></div>`;

  document.getElementById("calendar").innerHTML=table;
}

/* ===== DOWNLOAD PDF ===== */
function downloadPDF(){
  html2pdf().from(document.getElementById("content")).save("Prayer Times.pdf");
}
</script>
</body>
</html>
