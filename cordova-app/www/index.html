<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Time</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="cordova.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@300;400;600;700&display=swap');

/* Body & Background - Professional Dark Theme */
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
  color:#e0e1dd;
  overflow-x:hidden;
  position:relative;
}

/* Stars Background - Subtle */
.stars{
  position:fixed;
  top:0; left:0; width:100%; height:100%; z-index:0; overflow:hidden;
}
.star{
  position:absolute;
  width:1px; height:1px;
  background:#e0e1dd; border-radius:50%;
  animation:twinkle 4s infinite ease-in-out;
}
@keyframes twinkle{
  0%,100%{opacity:0.1;}50%{opacity:0.6;}
}

/* Moon - Professional */
.moon-right{
  position:fixed;
  top:50px; right:30px;
  width:100px; height:100px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #f8f9fa 0%, #e9ecef 35%, #adb5bd 60%, #6c757d 100%);
  box-shadow:0 0 40px rgba(248,249,250,0.6),0 0 80px rgba(248,249,250,0.3),
             inset -15px -15px 30px rgba(0,0,0,0.3),
             inset 10px 10px 20px rgba(255,255,255,0.2);
  animation:floatMoon 8s ease-in-out infinite;
  z-index:1;
}
@keyframes floatMoon{0%{transform:translateY(0);}50%{transform:translateY(-20px);}100%{transform:translateY(0);}}

/* Top Banner - Centered and Clean */
.top-banner{
  text-align:center;
  padding:100px 20px 30px;
  position:relative;
  z-index:2;
}
.arabic-main{font-family:'Amiri',serif;font-size:36px;color:#f8f9fa;}
.english-main{font-size:28px;color:#f8f9fa;margin-top:10px;}
.english-sub{font-size:16px;color:#adb5bd;margin-top:5px;}
.developer-line{margin-top:10px;font-size:12px;color:#6c757d;}
#todayDateDisplay{color:#f8f9fa;font-weight:600;margin-top:15px;font-size:18px;}

/* Next Prayer Timer - Enhanced */
#nextPrayerTimer{
  margin:20px auto;
  padding:20px;
  max-width:400px;
  text-align:center;
  font-weight:600;
  color:#f8f9fa;
  border:2px solid rgba(248,249,250,0.4);
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  box-shadow:0 0 20px rgba(248,249,250,0.2);
  animation:glowBorder 3s infinite alternate;
}
.next-prayer-name {
  font-weight: bold;
  font-size:1.3em;
  color:#f8f9fa;
}
@keyframes glowBorder{
  0%{box-shadow:0 0 10px rgba(248,249,250,0.1);}
  100%{box-shadow:0 0 30px rgba(248,249,250,0.4);}
}

/* Blinking Icon */
.waiting-icon{
  animation:blink 1.5s infinite;
}
@keyframes blink{
  0%{opacity:0.4;}
  50%{opacity:1;}
  100%{opacity:0.4;}
}

/* Container - Card-like */
.container{
  max-width:100%;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.08);
  position:relative;
  z-index:2;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

/* Controls - Grid Layout for Professional Look */
.controls{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap:10px;
  margin-bottom:20px;
}
button,input,select{
  padding:12px 16px;
  border-radius:25px;
  border:none;
  font-weight:600;
  font-size:14px;
  transition: all 0.3s ease;
}
button{background:linear-gradient(45deg,#f8f9fa,#e9ecef);color:#1b263b;cursor:pointer;}
button:hover{background:linear-gradient(45deg,#e9ecef,#dee2e6);}
select{background:#f8f9fa;color:#1b263b;}
input{background:rgba(255,255,255,0.1);color:#e0e1dd;border:1px solid rgba(255,255,255,0.2);}

/* Table - Professional */
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  background:rgba(0,0,0,0.7);
  border-radius:10px;
  overflow:hidden;
}
th,td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  text-align:center;
}
th{
  background:linear-gradient(45deg,#415a77,#1b263b);
  color:#f8f9fa;
  font-weight:700;
}
.highlight{
  background:linear-gradient(45deg,#f8f9fa,#e9ecef);
  color:#1b263b;
  font-weight:600;
  border-radius:8px;
  padding:8px;
}
.current-day{
  background:linear-gradient(45deg,#6c757d,#495057);
  border-left:4px solid #f8f9fa;
}
.hijri-date{
  font-size:12px;
  opacity:0.7;
  color:#adb5bd;
}
tr:last-child td{
  border-bottom:none;
}

/* Today's Prayers */
#todayPrayers{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-around;
  margin:20px 0;
}
#todayPrayers p{
  margin:10px;
  padding:10px;
  background:rgba(255,255,255,0.05);
  border-radius:10px;
  font-size:14px;
  color:#e0e1dd;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .top-banner { padding: 60px 10px 20px; }
  .arabic-main { font-size: 28px; }
  .english-main { font-size: 22px; }
  .moon-right { width: 60px; height: 60px; top: 30px; right: 15px; }
  .container { margin: 10px; padding: 15px; }
  .controls { grid-template-columns: 1fr; }
  button, input, select { padding: 10px; font-size: 13px; }
  table { font-size: 12px; }
  th, td { padding: 8px; }
  #todayPrayers { flex-direction: column; align-items: center; }
}
</style>

</head>
<body>

<!-- Stars & Moon -->
<div class="stars" id="stars"></div>
<div class="moon-right"></div>

<!-- Top Banner -->
<div class="top-banner">
  <div class="arabic-main">مؤذن</div>
  <div class="english-main">Muaddin</div>
  <div class="english-sub">World Wide Prayer Time</div>
  <div class="developer-line">Developed by: Shamnad Sharafudeen (D-Bross)</div>
  <p id="todayDateDisplay"></p>
  <div id="nextPrayerTimer"></div>
</div>

<!-- Today's Prayers -->
<div id="todayPrayers"></div>

<!-- Calendar & Controls -->
<div class="container" id="content">
  <div class="controls">
    <select onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="hi">हिंदी</option>
      <option value="ur">اردو</option>
    </select>
    <button onclick="getLocation()">📍 Auto Detect</button>
    <input type="text" id="city" placeholder="Enter City">
    <button onclick="manualSearch()">Search</button>
    <button onclick="requestNotificationPermission()" id="notifyBtn">🔔 Allow Notifications</button>
    <button onclick="displayView('week')">Week</button>
    <button onclick="displayView('month')">Month</button>
    <button onclick="toggleAdhaan()" id="adhaanBtn">🔊 Auto Adhaan ON</button>
  </div>
  <div id="calendar"></div>
</div>

<!-- Adhaan Audio -->
<audio id="adhaanAudio" preload="auto">
  <source src="https://cdn.islamic.network/audio/adhan/adhan.mp3" type="audio/mpeg">
</audio>

<script>
// Cordova Device Ready
document.addEventListener('deviceready', onDeviceReady, false);
function onDeviceReady() {
  console.log('Cordova is ready');
  // Initialize stars after device ready
  initStars();
}

// Stars Background
function initStars() {
  const starContainer = document.getElementById("stars");
  for (let i = 0; i < 200; i++) {
    let star = document.createElement("div");
    star.classList.add("star");
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDuration = (3 + Math.random() * 5) + "s";
    star.style.opacity = Math.random() * 0.5;
    starContainer.appendChild(star);
  }
}

/* ===== LANGUAGE ===== */
let currentLanguage = "en";
let lastData = null;
const translations = {
  en: { day: "Day", date: "Date", fajr: "Fajr", dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha", next: "Next Prayer" },
  ar: { day: "اليوم", date: "التاريخ", fajr: "الفجر", dhuhr: "الظهر", asr: "العصر", maghrib: "المغرب", isha: "العشاء", next: "الصلاة القادمة" },
  hi: { day: "दिन", date: "तारीख", fajr: "फज्र", dhuhr: "ज़ुहर", asr: "असर", maghrib: "मग़रिब", isha: "ईशा", next: "अगली नमाज़" },
  ur: { day: "دن", date: "تاریخ", fajr: "فجر", dhuhr: "ظہر", asr: "عصر", maghrib: "مغرب", isha: "عشاء", next: "اگلی نماز" }
};

function changeLanguage(lang) {
  currentLanguage = lang;
  document.body.style.direction = (lang === "ar" || lang === "ur") ? "rtl" : "ltr";
  if (lastData) renderCalendar(lastData, 'today');
}

/* ===== TIME FORMAT ===== */
function convertToAMPM(time) {
  time = time.replace(/ \(.*\)/, '');
  let [h, m] = time.split(":");
  h = parseInt(h);
  let ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  h = h ? h : 12;
  return h + ":" + m + " " + ampm;
}

/* ===== PRAYER SYSTEM ===== */
let prayerTimesToday = null;
let adhaanEnabled = true;
let lastAdhaanMinute = null;
let prayerSystemInterval = null;
let timerInterval = null;

function toggleAdhaan() {
  adhaanEnabled = !adhaanEnabled;
  document.getElementById("adhaanBtn").innerText = adhaanEnabled ? "🔊 Auto Adhaan ON" : "🔇 Auto Adhaan OFF";
  if (adhaanEnabled) {
    playAdhaan();
    lastAdhaanMinute = null;
  } else {
    stopAdhaan();
  }
}

function playAdhaan() {
  const audio = document.getElementById("adhaanAudio");
  audio.play().catch(() => {});
}

function stopAdhaan() {
  const audio = document.getElementById("adhaanAudio");
  audio.pause();
  audio.currentTime = 0;
}

function requestNotificationPermission() {
  cordova.plugins.notification.local.requestPermission(function (granted) {
    if (granted) {
      document.getElementById("notifyBtn").innerText = "🔔 Notifications ON";
      cordova.plugins.notification.local.schedule({
        id: 1,
        title: "Prayer Alarm Ready",
        text: "You will receive prayer notifications when times arrive."
      });
    } else {
      document.getElementById("notifyBtn").innerText = "🔕 Notifications OFF";
    }
  });
}

function showPrayerNotification(prayerName) {
  cordova.plugins.notification.local.schedule({
    id: Date.now(),
    title: "Prayer Time",
    text: `It's time for ${translations[currentLanguage][prayerName.toLowerCase()] || prayerName}.`,
    sound: "file://adhan.mp3" // Assuming adhan.mp3 is in www folder
  });
}

function initializePrayerSystem(timings) {
  prayerTimesToday = {
    Fajr: timings.Fajr.substring(0, 5),
    Dhuhr: timings.Dhuhr.substring(0, 5),
    Asr: timings.Asr.substring(0, 5),
    Maghrib: timings.Maghrib.substring(0, 5),
    Isha: timings.Isha.substring(0, 5)
  };
  if (prayerSystemInterval) clearInterval(prayerSystemInterval);
  updatePrayerSystem();
  prayerSystemInterval = setInterval(updatePrayerSystem, 1000);
}

function updatePrayerSystem() {
  if (!prayerTimesToday) return;
  let now = new Date();
  let ch = now.getHours().toString().padStart(2, '0');
  let cm = now.getMinutes().toString().padStart(2, '0');
  let current = ch + ":" + cm;

  for (let p in prayerTimesToday) {
    if (current === prayerTimesToday[p] && lastAdhaanMinute !== current && adhaanEnabled) {
      playAdhaan();
      showPrayerNotification(p);
      lastAdhaanMinute = current;
    }
  }
}

/* ===== LOCATION ===== */
function getLocation() {
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
    const data = await response.json();
    let city = data.address.city || data.address.town || data.address.village || data.address.state;
    let country = data.address.country;
    loadRamadan(city, country);
  }, () => { alert("Location permission denied."); });
}

function manualSearch() {
  let city = document.getElementById("city").value.trim();
  if (city === "") { alert("Please enter city name."); return; }
  loadRamadan(city, "");
}

/* ===== LOAD & RENDER ===== */
async function loadRamadan(city, country) {
  let today = new Date();
  let month = today.getMonth() + 1;
  let year = today.getFullYear();

  const response = await fetch(`https://api.aladhan.com/v1/calendarByCity/${year}/${month}?city=${city}&country=${country}&method=4`);
  const data = await response.json();
  lastData = data;
  renderCalendar(data, 'today');
}

function displayView(viewMode) {
  if (lastData) {
    renderCalendar(lastData, viewMode);
  }
}

function startNextPrayerTimer(prayerTimes) {
  function updateTimer() {
    let now = new Date();
    let currentMinutes = now.getHours() * 60 + now.getMinutes();

    let nextName = "";
    let nextTime = 0;

    for (let p in prayerTimes) {
      let [h, m] = prayerTimes[p].split(":");
      let total = parseInt(h) * 60 + parseInt(m);

      if (total > currentMinutes) {
        nextName = p;
        nextTime = total;
        break;
      }
    }

    if (!nextName) {
      nextName = "Fajr";
      let [h, m] = prayerTimes.Fajr.split(":");
      nextTime = (parseInt(h) * 60 + parseInt(m)) + 1440;
    }

    let diff = nextTime - currentMinutes;
    let hh = Math.floor(diff / 60);
    let mm = diff % 60;
    let ss = 59 - now.getSeconds();

    document.getElementById("nextPrayerTimer").innerHTML = `
      <span class="waiting-icon">⏳</span> Next Prayer: <span class="next-prayer-name">${nextName}</span><br>
      🕐 ${hh}h ${mm}m ${ss}s remaining
    `;
  }

  if (timerInterval) clearInterval(timerInterval);
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

function renderCalendar(data, viewMode = 'today') {
  let todayDate = new Date();
  let currentDay = todayDate.getDate();
  let today = data.data[currentDay - 1];

  document.getElementById("todayDateDisplay").innerHTML = today.date.gregorian.date + " | " + today.date.hijri.date;

  let todayPrayersHTML = `
    <p><strong>${translations[currentLanguage].fajr}:</strong> ${convertToAMPM(today.timings.Fajr)}</p>
    <p><strong>${translations[currentLanguage].dhuhr}:</strong> ${convertToAMPM(today.timings.Dhuhr)}</p>
    <p><strong>${translations[currentLanguage].asr}:</strong> ${convertToAMPM(today.timings.Asr)}</p>
    <p><strong>${translations[currentLanguage].maghrib}:</strong> ${convertToAMPM(today.timings.Maghrib)}</p>
    <p><strong>${translations[currentLanguage].isha}:</strong> ${convertToAMPM(today.timings.Isha)}</p>
  `;
  document.getElementById("todayPrayers").innerHTML = todayPrayersHTML;

  initializePrayerSystem(today.timings);
  startNextPrayerTimer(prayerTimesToday);

  let tableData = [];
  if (viewMode === 'today') {
    tableData = [today];
  } else if (viewMode === 'week') {
    const startIndex = currentDay - 1;
    tableData = data.data.slice(startIndex, startIndex + 7);
  } else if (viewMode === 'month') {
    tableData = data.data;
  }

  let table = `<table><tr>
    <th>${translations[currentLanguage].day}</th>
    <th>${translations[currentLanguage].date}</th>
    <th>${translations[currentLanguage].fajr}</th>
    <th>${translations[currentLanguage].dhuhr}</th>
    <th>${translations[currentLanguage].asr}</th>
    <th>${translations[currentLanguage].maghrib}</th>
    <th>${translations[currentLanguage].isha}</th>
  </tr>`;

  tableData.forEach((day, index) => {
    if (day && day.date && day.date.gregorian && day.timings) {
      let isCurrentDay = (parseInt(day.date.gregorian.day) === currentDay && viewMode !== 'week');
      table += `<tr class="${isCurrentDay ? 'current-day' : ''}">
        <td>${day.date.gregorian.day}</td>
        <td>${day.date.gregorian.date}<div class="hijri-date">${day.date.hijri.date}</div></td>
        <td class="highlight">${convertToAMPM(day.timings.Fajr)}</td>
        <td>${convertToAMPM(day.timings.Dhuhr)}</td>
        <td>${convertToAMPM(day.timings.Asr)}</td>
        <td>${convertToAMPM(day.timings.Maghrib)}</td>
        <td>${convertToAMPM(day.timings.Isha)}</td>
      </tr>`;
    }
  });
  table += "</table>";

  table += `<div style="text-align:center; margin-top: 20px;">`;
  if (viewMode === 'today') {
    table += `<button onclick="displayView('week')">Week Prayer Time</button>`;
  } else if (viewMode === 'week') {
    table += `<button onclick="displayView('month')">Month Prayer Time</button>`;
  }
  table += `<button onclick="downloadPDF()">📄 PDF</button></div>`;

  document.getElementById("calendar").innerHTML = table;
}

/* ===== DOWNLOAD PDF ===== */
function downloadPDF() {
  html2pdf().from(document.getElementById("content")).save("Prayer Times.pdf");
}
</script>
</body>
</html>
