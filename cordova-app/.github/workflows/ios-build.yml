name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Install dependencies
      run: npm install
    - name: Add iOS platform
      run: cordova platform add ios
    - name: Install plugins
      run: cordova plugin add cordova-plugin-local-notification cordova-plugin-geolocation cordova-plugin-media
    - name: Build iOS
      run: cordova build ios
    - name: Upload iOS App
      uses: actions/upload-artifact@v3
      with:
        name: ios-app
        path: platforms/ios/build/device/*.app